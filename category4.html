<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="style.css"rel="stylesheet">
  <title>EasyDorm</title>
</head>
<body>
    <div id="loader" class="loader-overlay">
    <div class="spinner"></div>
    <p>Loading Recipes ...</p>
</div> 
<div class="page">
    <div>
        <a href=index.html><p>Home</a></p>
    </div>
    <div class="header">
        <h1>Kettle and Microwave</h1>
    </div>

<div class="categories">

    <div class="card">
        <a href="recipe.html?id="><p>Picture 1</p>
        <p>Recipe 1</p></a>
         <br>
    </div>

    <div class="card">
        <a href="recipe.html?id="><p>Picture 2</p>
        <p>Recipe 2</p></a>
         <br>
    </div>

    <div class="card">
        <a href="recipe.html?id="><p>Picture 3</p>
        <p>Recipe 3</p></a>
         <br>
    </div>

    <div class="card">
        <a href="recipe.html?id="><p>Picture 4</p>
        <p>Recipe 4</p></a>
         <br>
    </div>
</div>
</div>
<script>
        const loader = document.getElementById("loader");
        const categoryLink = document.querySelectorAll(".page .card a")
        categoryLink.forEach(link=>{
            link.addEventListener("click", function(event){
                event.preventDefault();
                const targetUrl = this.getAttribute("href");

                loader.classList.add("active");
                setTimeout(() =>{
                    window.location.href = targetUrl;
                }, 600);
            });
        });
    </script>
</body>
</html>
