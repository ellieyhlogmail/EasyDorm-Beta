<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css"rel="stylesheet">
  <title>EasyDorm</title>
</head>
<body>


<div id="loader" class="loader-overlay">
    <div class="spinner"></div>
    <p>Loading Recipes ...</p>
</div> 
    <div class="page">
        <div class="header">
            <h1>EasyDorm</h1>
            <p>Simple, affordable, and dorm-friendly meals for students.</p>
        </div>

    <div class="categories">
        <div class="card">
        <a href="category1.html">
            <img src="https://lh3.googleusercontent.com/d/1sNEqjCLv3xhb6dCr7IdIF5g0Am_lLMJM" alt="Cold Foods Category">
            <p>Freezer</p></a>
            <br>
        </div>

        <div class="card">
            <a href=category2.html><img src="https://lh3.googleusercontent.com/d/1W7ZJ-eeQxzKQ1atmDoRffmWDQtkJxmoZ" alt="Microwave Category">
            <p>Fridge</p></a>
            <br>
        </div>

        <div class="card">
            <a href=category3.html><img src="https://lh3.googleusercontent.com/d/1R5w1NfEPUFc4TsTbWnbV5mVSOykzkpl8" alt="Blender Category">
            <p>Blender and Drinks</p></a>
            <br>
        </div>



    <div class="about">
        <h2>About</h2>
        <p>EasyDorm is a website that helps boarding students cook easy, affordable, and dorm friendly meals in a limited amount of time. <p>
    </div>
</div>
    <script>
        const loader = document.getElementById("loader");
        const categoryLink = document.querySelectorAll(".categories .card a")
        categoryLink.forEach(link=>{
            link.addEventListener("click", function(event){
                event.preventDefault();
                const targetUrl = this.getAttribute("href");

                loader.classList.add("active");
                setTimeout(() =>{
                    window.location.href = targetUrl;
                }, 600);
            });
        });
    </script>

</body>
</html>
